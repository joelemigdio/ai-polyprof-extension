            <div role="cell"><input aria-label="CSC 3001" type="checkbox" checked /></div>

            <div role="cell"><p>Modern Application Development</p></div>
            <div role="cell">4</div>
            <button type="button">Select Sections</button>
          </div>
          <div role="row" data-row-id="course-3710">
            <div role="cell"><input aria-label="CSC 3710" type="checkbox" /></div>
            <div role="rowheader"><button type="button">CSC 3710</button></div>
            <div role="cell"><p>Game Design and Development</p></div>
            <div role="cell">4</div>
            <button type="button">Select Sections</button>
          </div>
        </div>
      </div>
